<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0B0B0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RISEN">
<title>RISEN</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/icon-192.png">
<link rel="preload" href="assets/fonts/oswald.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Fonts live in the app (Oswald and Inter, SIL Open Font License), so they work offline from the first launch */
  @font-face{font-family:Oswald;font-weight:200 700;font-display:swap;src:url(assets/fonts/oswald.woff2) format("woff2")}
  @font-face{font-family:Inter;font-weight:100 900;font-display:swap;src:url(assets/fonts/inter.woff2) format("woff2")}
  :root{--bg:#0B0B0B;--card:#1A1A1A;--line:#262626;--text:#F2F2F2;--muted:#9A9A9A;--volt:#CCFF00}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
  .screen{position:fixed;top:0;left:0;right:0;height:100%;transition:opacity .5s ease,transform .5s ease}
  .hidden{opacity:0;pointer-events:none;transform:scale(1.04)}

  /* INTRO: plain photo + real logo, text and button in code (stays right on every screen size) */
  #intro{overflow:hidden;background:var(--bg)}
  #intro .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;animation:fade .8s ease both}
  #intro::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(11,11,11,.75) 0%,rgba(11,11,11,0) 18%,rgba(11,11,11,0) 50%,rgba(11,11,11,.7) 72%,#0B0B0B 100%)}
  .brand{position:absolute;z-index:2;top:calc(env(safe-area-inset-top) + 18px);left:24px;display:flex;align-items:center;gap:12px;
    animation:fade 1s ease .3s both}
  .brand img{height:30px;width:auto}
  .brand span{font-family:Oswald,sans-serif;font-weight:500;font-size:22px;letter-spacing:.32em;color:var(--text)}
  .hero{position:absolute;z-index:2;left:28px;right:28px;bottom:calc(env(safe-area-inset-bottom) + 36px);
    animation:rise 1s cubic-bezier(.2,.8,.2,1) .2s both}
  .hero h1{font-family:Oswald,sans-serif;font-weight:700;font-size:clamp(44px,13vw,60px);line-height:.98;text-transform:uppercase;letter-spacing:.01em}
  .hero h1 em{display:block;font-style:normal;color:var(--volt)}
  .hero p{margin-top:14px;font-size:13px;letter-spacing:.24em;line-height:1.7;color:#C9C9C9;text-transform:uppercase}
  #login{margin-top:30px;width:100%;min-height:56px;border-radius:999px;border:1.5px solid var(--text);background:rgba(11,11,11,.55);
    color:var(--text);font-family:Oswald,sans-serif;font-weight:700;font-size:20px;letter-spacing:.1em;cursor:pointer;
    animation:glow 2.4s ease-in-out 1.4s infinite;transition:transform .12s ease,background .12s ease}
  #login:active{transform:scale(.97);background:rgba(204,255,0,.15)}
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(204,255,0,0)}50%{box-shadow:0 0 22px 2px rgba(204,255,0,.5)}}
  @keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  #app{background:var(--bg)}

  /* APP screens scroll; the intro stays fixed */
  .scroll{overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
  .page{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
    padding:calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px)}
  #app img{width:96px}
  #app h1{font-family:Oswald,sans-serif;font-weight:700;font-size:30px;letter-spacing:.06em;text-transform:uppercase}
  #app p{color:var(--muted);font-size:15px}
  .page>:first-child{margin-top:auto}
  .version{margin-top:auto;padding-top:24px;font-size:11px;letter-spacing:.1em;color:var(--muted);opacity:.6}
  .pill{margin-top:10px;min-height:48px;padding:0 28px;border-radius:999px;border:1px solid var(--line);background:var(--card);
    color:var(--text);font-family:Oswald,sans-serif;font-size:14px;letter-spacing:.2em;cursor:pointer}
</style>
</head>
<body>
  <section id="intro" class="screen">
    <img class="photo" src="assets/bg.jpg" alt="">
    <div class="brand"><img src="assets/mark.png" alt=""><span>RISEN</span></div>
    <div class="hero">
      <h1>Stronger<em>Every day</em></h1>
      <p>Train &bull; Track &bull; Progress<br>Rise again</p>
      <button id="login">LOG IN</button>
    </div>
  </section>

  <section id="app" class="screen scroll hidden">
    <div class="page">
      <img src="assets/icon-192.png" alt="">
      <h1>Hello Siza</h1>
      <p>The gym is being built. Coming soon.</p>
      <button class="pill" id="back">BACK</button>
      <div class="version" id="version"></div>
    </div>
  </section>

<script>
  const intro=document.getElementById('intro'), app=document.getElementById('app'), btn=document.getElementById('login');
  btn.onclick=()=>{intro.classList.add('hidden');app.classList.remove('hidden')};
  document.getElementById('back').onclick=()=>{app.classList.add('hidden');intro.classList.remove('hidden')};
  if('serviceWorker' in navigator){
    // Check for a new release on launch and each time the app comes back to the foreground
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update()});
    });
    // When a new release takes over, reload once so the new files show
    let reloading=false;
    if(navigator.serviceWorker.controller) navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(!reloading){reloading=true;location.reload()}
    });
  }
  // Show the installed version (small text on the app screen) to confirm an update arrived
  if('caches' in window) caches.keys().then(k=>{const v=k.find(n=>n.startsWith('risen-'));
    if(v) document.getElementById('version').textContent='v'+v.slice(6)});
</script>
</body>
</html>
